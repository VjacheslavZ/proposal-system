services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:./data/dev.db
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    volumes:
      # Source code and the SQLite file (./data/dev.db) are shared with the host.
      - .:/app
      # Keep Linux-built dependencies and build output inside the container.
      - /app/node_modules
      - /app/.next
